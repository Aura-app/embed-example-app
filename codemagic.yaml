workflows:
  expo-embed-build:
    name: Expo Embed Build & Publish
    max_build_duration: 60

    environment:
      groups:
        - expo-embed
        # Required variables in the 'expo-embed' group:
        #
        # Android:
        #   ANDROID_KEYSTORE_BASE64      — base64-encoded keystore.jks
        #   ANDROID_KEYSTORE_PASSWORD    — keystore store password
        #   ANDROID_KEY_ALIAS            — key alias
        #   ANDROID_KEY_PASSWORD         — key password
        #
        # iOS (App Store Connect API — used for automatic signing):
        #   APP_STORE_CONNECT_PRIVATE_KEY      — contents of the .p8 key file
        #   APP_STORE_CONNECT_KEY_IDENTIFIER   — key ID (e.g. ABC1234567)
        #   APP_STORE_CONNECT_ISSUER_ID        — issuer UUID
        #
        # Publishing:
        #   GCLOUD_SERVICE_ACCOUNT_CREDENTIALS — Google Play JSON key

      vars:
        APPLE_TEAM_ID: "27XW93998V"
        BUNDLE_ID: "com.aura.embedapp"

      node: 18.17.0
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
        - node_modules
        - $HOME/.gradle/caches

    triggering:
      events: [] # Manual trigger only

    scripts:
      # ── Shared ──────────────────────────────────────────────────────────────

      - name: Install dependencies
        script: |
          npm ci

      - name: Expo prebuild
        script: |
          npx expo prebuild --clean --platform all

      # ── Android ─────────────────────────────────────────────────────────────

      - name: Build Android (AAB)
        script: |
          # Decode keystore to android/app/ — this is where build.gradle's
          # file("keystore.jks") resolves to, so no injected -P params needed.
          # The generated build.gradle reads ANDROID_KEYSTORE_PASSWORD,
          # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD via System.getenv() directly.
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

          cd android
          ./gradlew bundleRelease

      # ── iOS ─────────────────────────────────────────────────────────────────

      - name: Install iOS pods
        script: |
          cd ios
          pod install

      - name: Set up iOS code signing
        script: |
          # Create a temporary keychain for this build
          keychain initialize

          # Download the App Store distribution certificate and provisioning
          # profile from App Store Connect using the API key env vars.
          # --create will create the profile if it doesn't exist yet.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          # Import the downloaded certificate into the temporary keychain
          keychain add-certificates

          # Update the Xcode project to use the fetched profile (switches
          # the target from automatic to manual signing) and writes
          # $CM_BUILD_DIR/export_options.plist for the export step.
          xcode-project use-profiles

      - name: Fix Swift optimization in Pods
        script: |
          cd ios
          ruby << 'RUBY_SCRIPT'
          require 'xcodeproj'

          project_path = 'Pods/Pods.xcodeproj'
          unless File.exist?(project_path)
            puts "Pods project not found — skipping fix"
            exit 0
          end

          project = Xcodeproj::Project.open(project_path)
          project.targets.each do |target|
            target.build_configurations.each do |config|
              if config.name == 'Release'
                config.build_settings['SWIFT_OPTIMIZATION_LEVEL'] = '-Onone'
              end
            end
          end
          project.save
          puts "Swift optimization fix applied"
          RUBY_SCRIPT

      - name: Build iOS (IPA)
        script: |
          cd ios
          set -o pipefail

          xcodebuild \
            -workspace AuraEmbedApp.xcworkspace \
            -scheme AuraEmbedApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/app.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive 2>&1 | tee xcodebuild.log
          BUILD_RESULT=${PIPESTATUS[0]}

          if [ $BUILD_RESULT -ne 0 ]; then
            echo "=== BUILD FAILED — last 50 error lines ==="
            grep -i "error:" xcodebuild.log | tail -50
            exit $BUILD_RESULT
          fi

          # export_options.plist is generated by 'xcode-project use-profiles'
          xcodebuild -exportArchive \
            -archivePath build/app.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist "$CM_BUILD_DIR/export_options.plist"

    artifacts:
      - ios/build/ipa/*.ipa
      - android/app/build/outputs/bundle/release/*.aab

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false

      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false

      email:
        recipients:
          - kutbip@aura.services
        notify:
          success: true
          failure: true
