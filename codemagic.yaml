workflows:
  expo-embed-build:
    name: Expo Embed Build & Publish
    max_build_duration: 60

    environment:
      groups:
        - expo-embed
        # Required variables in the 'expo-embed' group:
        #
        # Android:
        #   ANDROID_KEYSTORE_BASE64      — base64-encoded keystore.jks
        #   ANDROID_KEYSTORE_PASSWORD    — keystore store password
        #   ANDROID_KEY_ALIAS            — key alias
        #   ANDROID_KEY_PASSWORD         — key password
        #
        # iOS (manual certificate + profile signing):
        #   CM_CERTIFICATE             — base64 of Certificates.p12
        #   CM_CERTIFICATE_PASSWORD    — password used when exporting the .p12
        #   CM_PROVISIONING_PROFILE    — base64 of EmbedApp.mobileprovision
        #
        # iOS (App Store Connect API — used for TestFlight/App Store publishing):
        #   APP_STORE_CONNECT_PRIVATE_KEY      — contents of the .p8 key file
        #   APP_STORE_CONNECT_KEY_IDENTIFIER   — key ID (e.g. ABC1234567)
        #   APP_STORE_CONNECT_ISSUER_ID        — issuer UUID
        #
        # Publishing:
        #   GCLOUD_SERVICE_ACCOUNT_CREDENTIALS — Google Play JSON key

      vars:
        APPLE_TEAM_ID: "27XW93998V"
        BUNDLE_ID: "com.aura.embedapp"

      node: 18.17.0
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
        - node_modules
        - $HOME/.gradle/caches

    triggering:
      events: [] # Manual trigger only

    scripts:
      # ── Shared ──────────────────────────────────────────────────────────────

      - name: Install dependencies
        script: |
          npm ci

      - name: Expo prebuild
        script: |
          npx expo prebuild --clean --platform all

      # ── Android ─────────────────────────────────────────────────────────────

      - name: Build Android (AAB)
        script: |
          set -e

          KEYSTORE_PATH="$CM_BUILD_DIR/android/app/keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      # ── iOS ─────────────────────────────────────────────────────────────────

      - name: Install iOS pods
        script: |
          cd ios
          pod install

      - name: Set up iOS code signing
        script: |
          set -e

          # Create a temporary keychain for this build
          keychain initialize

          # Decode and import the Apple Distribution certificate + private key.
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          if [ -n "$CM_CERTIFICATE_PASSWORD" ]; then
            keychain add-certificates \
              --certificate /tmp/certificate.p12 \
              --certificate-password "$CM_CERTIFICATE_PASSWORD"
          else
            keychain add-certificates --certificate /tmp/certificate.p12
          fi

          # Install the App Store provisioning profile where Xcode looks for it.
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          PROFILE_PATH="$PROFILES_DIR/embedapp.mobileprovision"
          echo "$CM_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"

          # Extract the UUID and name from the profile for use later.
          security cms -D -i "$PROFILE_PATH" > /tmp/profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist)
          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile Name: $PROFILE_NAME"

          # Export so the next step (Build iOS) can use them.
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$CM_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$CM_ENV"

          # Write export_options.plist that the export step needs.
          cat > "$CM_BUILD_DIR/export_options.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>$APPLE_TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_NAME</string>
              </dict>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          echo "=== export_options.plist ==="
          cat "$CM_BUILD_DIR/export_options.plist"

      - name: Fix Swift optimization in Pods
        script: |
          cd ios
          ruby << 'RUBY_SCRIPT'
          require 'xcodeproj'

          project_path = 'Pods/Pods.xcodeproj'
          unless File.exist?(project_path)
            puts "Pods project not found — skipping fix"
            exit 0
          end

          project = Xcodeproj::Project.open(project_path)
          project.targets.each do |target|
            target.build_configurations.each do |config|
              if config.name == 'Release'
                config.build_settings['SWIFT_OPTIMIZATION_LEVEL'] = '-Onone'
              end
            end
          end
          project.save
          puts "Swift optimization fix applied"
          RUBY_SCRIPT

      - name: Build iOS (IPA)
        script: |
          cd ios
          set -o pipefail

          # Manual signing with the installed profile (UUID from previous step).
          xcodebuild \
            -workspace AuraEmbedApp.xcworkspace \
            -scheme AuraEmbedApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/app.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive 2>&1 | tee xcodebuild.log
          BUILD_RESULT=${PIPESTATUS[0]}

          if [ $BUILD_RESULT -ne 0 ]; then
            echo "=== BUILD FAILED — last 50 error lines ==="
            grep -i "error:" xcodebuild.log | tail -50
            exit $BUILD_RESULT
          fi

          xcodebuild -exportArchive \
            -archivePath build/app.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist "$CM_BUILD_DIR/export_options.plist"

    artifacts:
      - ios/build/ipa/*.ipa
      - android/app/build/outputs/bundle/release/*.aab

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false

      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false

      email:
        recipients:
          - kutbip@aura.services
        notify:
          success: true
          failure: true
